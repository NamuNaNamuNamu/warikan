<div class = "area--top_spacer"></div>

<!-- TODO: 共通化する。input と。 -->
<div class = "area--progress_tracker">
    <div class = "area--spacer"></div>
    <div class = "area--step">
        <div class = "step_number">STEP1</div>
        <div class = "step_text">会計金額と人数の入力</div>
    </div>
    <div class = "area--arrow">
        <div class = "arrow"></div>
        <div class = "arrow"></div>
        <div class = "arrow"></div>
    </div>
    <div class = "area--step is-active">
        <div class = "step_number">STEP2</div>
        <div class = "step_text">ワリカンオプションの設定</div>
    </div>
    <div class = "area--spacer"></div>
</div>

<div class = "area--app-body">
    <div class = "area--spacer"></div>
    <div class = "area--body">
        <div class = "area--consider-settlement">
            <div class = "option-title">
                <span>精算係ありがとうオプション</span>
                <label class = "toggle-switch">
                    <input type = "checkbox" class = "visually-hidden">
                    <span class = "slider"></span>
                </label>
            </div>
            <div class = "field">
                <label for = "maximum-appreciation-amount">最大ありがとう額：</label>
                <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "maximum-appreciation-amount">
                <span class = "unit">円</span>
            </div>
        </div>
            
        <div class = "area--consider-difference-of-portion">
            <div class = "option-title">
                <span>飲食量考慮オプション</span>
                <label class = "toggle-switch">
                    <input type = "checkbox" class = "visually-hidden">
                    <span class = "slider"></span>
                </label>
            </div>
            <div class = "pay-a-lot">
                <div class = "payer-category">
                    <span>多く払う人　</span>
                    <label class = "toggle-switch">
                        <input type = "checkbox" class = "visually-hidden">
                        <span class = "slider"></span>
                    </label>
                </div>
                <div class = "fields">
                    <div class = "field">
                        <label for = "amount-pay-a-lot">　額：</label>
                        <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "amount-pay-a-lot">
                        <span class = "unit">円</span>
                    </div>
                    <div class = "field">
                        <label for = "num-people-pay-a-lot">人数：</label>
                        <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "num-people-pay-a-lot">
                        <span class = "unit">人</span>
                    </div>
                </div>
            </div>
            <div class = "pay-a-little">
                <div class = "payer-category">
                    <span>少なく払う人</span>
                    <label class = "toggle-switch">
                        <input type = "checkbox" class = "visually-hidden">
                        <span class = "slider"></span>
                    </label>
                </div>
                <div class = "fields">
                    <div class = "field">
                        <label for = "amount-pay-a-little">　額：</label>
                        <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "amount-pay-a-little">
                        <span class = "unit">円</span>
                    </div>
                    <div class = "field">
                        <label for = "num-people-pay-a-little">人数：</label>
                        <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "num-people-pay-a-little">
                        <span class = "unit">人</span>
                    </div>
                </div>
            </div>
        </div>

        <div class = "area--result">
            <div class = "area--title">
                <span class = "title-result">結果</span>
            </div>
            <div class = "area--others">
                <div class = "area--body">
                    <!-- TODO: この部分は JS で動的に制御。 -->
                    <div class = "pay-a-lot">
                        <span class = "payer-category">多く払う</span>
                        <span class = "num-people">2</span>
                        <span class = "unit-num-people">人</span>
                        <span class = "ha">は</span>
                        <span class = "amount">4000</span>
                        <span class = "unit-amount">円</span>
                    </div>
                    <div class = "pay-a-little">
                        <span class = "payer-category">少なく払う</span>
                        <span class = "num-people">1</span>
                        <span class = "unit-num-people">人</span>
                        <span class = "ha">は</span>
                        <span class = "amount">2000</span>
                        <span class = "unit-amount">円</span>
                    </div>
                    <div class = "settler">
                        <span class = "payer-category">精算係</span>
                        <span class = "num-people"></span>
                        <span class = "unit-num-people"></span>
                        <span class = "ha">は</span>
                        <span class = "amount">3045</span>
                        <span class = "unit-amount">円</span>
                    </div>
                    <div class = "normal">
                        <span class = "payer-category">残りの</span>
                        <span class = "num-people">1</span>
                        <span class = "unit-num-people">人</span>
                        <span class = "ha">は</span>
                        <span class = "amount">3200</span>
                        <span class = "unit-amount">円</span>
                    </div>
                    <div class = "normal-adjuster">
                        <span class = "payer-category"></span>
                        <span class = "num-people">1</span>
                        <span class = "unit-num-people">人</span>
                        <span class = "ha">は</span>
                        <span class = "amount">3200</span>
                        <span class = "unit-amount">円</span>
                    </div>
                </div>
                <div class = "area--button">
                    <button id = "temp-back-to-screen-title" class = "btn btn--close">終了</button>
                </div>
            </div>
        </div>
    </div>
</div>
