<div class = "area--top_spacer"></div>

<!-- TODO: 共通化する。selectOption と。 -->
<div class = "area--progress_tracker">
    <div class = "area--spacer"></div>
    <div class = "area--step is-active">
        <div class = "step_number">STEP1</div>
        <div class = "step_text">会計金額と人数の入力</div>
    </div>
    <div class = "area--arrow">
        <div class = "arrow"></div>
        <div class = "arrow"></div>
        <div class = "arrow"></div>
    </div>
    <div class = "area--step">
        <div class = "step_number">STEP2</div>
        <div class = "step_text">ワリカンオプションの設定</div>
    </div>
    <div class = "area--spacer"></div>
</div>

<div class = "area--input">
    <div class = "area--spacer"></div>
    <div class = "area--body">
        <div class = "field">
            <label for = "total-amount">会計金額：</label>
            <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "total-amount">
            <span class = "unit">円</span>
        </div>
        <div class = "field">
            <label for = "num-people">　人数　：</label>
            <input type = "text" inputmode = "numeric" pattern = "[0-9]*" id = "num-people">
            <span class = "unit">人</span>
        </div>
    </div>
</div>

<div class = "area--button">
    <button
        id = "button-next"
        class = "button button--next"
        data-result-screen = "selectOption"
    >次へ</button>
</div>
